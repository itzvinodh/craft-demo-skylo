<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1600" viewBox="0 0 2000 1600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e40af"/>
    </marker>
  </defs>

  <rect width="2000" height="1600" fill="#f8fafc"/>

  <!-- Title -->
  <text x="30" y="38" font-size="28" font-weight="700" fill="#0f172a">Skylo Regional Hub — Three-Layer Architecture</text>
  <text x="30" y="62" font-size="14" fill="#475569">Data-Ingress → Core-Network → UPF: Parse, Decide, Forward</text>

  <!-- Input: Ground Station -->
  <rect x="30" y="100" width="280" height="120" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="170" y="128" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">Ground Station (On-Prem)</text>
  <text x="170" y="150" font-size="11" fill="#7c2d12" text-anchor="middle">Raw 3GPP signaling data</text>
  <text x="170" y="170" font-size="11" fill="#7c2d12" text-anchor="middle">Device: IMSI:123456789012345</text>
  <text x="170" y="190" font-size="11" fill="#7c2d12" text-anchor="middle">Signal: -85 dBm, Location info</text>

  <!-- Arrow to TGW -->
  <line x1="310" y1="160" x2="360" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="330" y="145" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Direct</text>
  <text x="330" y="160" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Connect</text>

  <!-- TGW -->
  <rect x="360" y="90" width="150" height="140" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="435" y="120" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">TGW</text>
  <text x="435" y="145" font-size="10" fill="#78350f" text-anchor="middle">Transit Gateway</text>
  <text x="435" y="165" font-size="10" fill="#78350f" text-anchor="middle">attachment in</text>
  <text x="435" y="180" font-size="10" fill="#78350f" text-anchor="middle">private subnet</text>
  <text x="435" y="205" font-size="10" fill="#78350f" text-anchor="middle">(3 AZs)</text>

  <!-- Arrow to Layer 1 -->
  <line x1="510" y1="160" x2="560" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ========== LAYER 1: DATA-INGRESS ========== -->
  <rect x="560" y="70" width="380" height="180" rx="10" fill="#eef2ff" stroke="#3730a3" stroke-width="2.5"/>
  <circle cx="580" cy="90" r="16" fill="#3730a3"/>
  <text x="580" y="96" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="750" y="100" font-size="15" font-weight="700" fill="#312e81">LAYER 1: DATA-INGRESS</text>
  <text x="750" y="122" font-size="11" fill="#312e81">(Parser / Normalizer)</text>

  <!-- Data-ingress pod details -->
  <rect x="575" y="140" width="350" height="100" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="750" y="160" font-size="12" font-weight="600" fill="#312e81" text-anchor="middle">Data-Ingress Pod (5 replicas, HPA 3–100)</text>

  <text x="590" y="185" font-size="10" fill="#334155">Input:</text>
  <text x="590" y="202" font-size="9" fill="#475569">Raw 3GPP message (binary protocol)</text>

  <text x="700" y="185" font-size="10" fill="#334155">Process:</text>
  <text x="700" y="202" font-size="9" fill="#475569">Parse → Extract device ID, session type</text>

  <text x="970" y="185" font-size="10" fill="#334155">Output:</text>
  <text x="970" y="202" font-size="9" fill="#475569">Normalized JSON to Kafka topic</text>

  <!-- Arrow to Layer 2 -->
  <line x1="940" y1="250" x2="940" y2="300" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="960" y="280" font-size="10" fill="#334155" text-anchor="start" font-weight="600">Kafka topic:</text>
  <text x="960" y="295" font-size="10" fill="#334155" text-anchor="start">devices.connectivity</text>
  <text x="960" y="310" font-size="10" fill="#334155" text-anchor="start">.normalized</text>

  <!-- ========== LAYER 2: CORE-NETWORK ========== -->
  <rect x="560" y="300" width="760" height="240" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="580" cy="320" r="16" fill="#b45309"/>
  <text x="580" y="326" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="750" y="330" font-size="15" font-weight="700" fill="#78350f">LAYER 2: CORE-NETWORK</text>
  <text x="750" y="352" font-size="11" fill="#78350f">(Decision / Intelligence)</text>

  <!-- Core-network pod container -->
  <rect x="575" y="370" width="730" height="155" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="750" y="390" font-size="12" font-weight="600" fill="#78350f" text-anchor="middle">Core-Network Pod (5 replicas, HPA 3–100)</text>

  <!-- Process boxes inside Layer 2 -->
  <rect x="585" y="405" width="110" height="55" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="640" y="425" font-size="10" font-weight="600" fill="#1e40af" text-anchor="middle">Query Redis</text>
  <text x="640" y="440" font-size="9" fill="#334155" text-anchor="middle">device:123...</text>
  <text x="640" y="453" font-size="9" fill="#334155" text-anchor="middle">get session</text>

  <line x1="695" y1="432" x2="725" y2="432" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="725" y="405" width="110" height="55" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
  <text x="780" y="425" font-size="10" font-weight="600" fill="#065f46" text-anchor="middle">Authorize</text>
  <text x="780" y="440" font-size="9" fill="#334155" text-anchor="middle">device allowed?</text>
  <text x="780" y="453" font-size="9" fill="#334155" text-anchor="middle">QoS rules?</text>

  <line x1="835" y1="432" x2="865" y2="432" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="865" y="405" width="110" height="55" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="920" y="425" font-size="10" font-weight="600" fill="#78350f" text-anchor="middle">Decide</text>
  <text x="920" y="440" font-size="9" fill="#334155" text-anchor="middle">UPF target?</text>
  <text x="920" y="453" font-size="9" fill="#334155" text-anchor="middle">QoS level?</text>

  <!-- Output arrows from Layer 2 -->
  <line x1="640" y1="460" x2="640" y2="495" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="585" y="480" font-size="9" fill="#1d4ed8" font-weight="600">Update Redis</text>

  <line x1="780" y1="460" x2="780" y2="495" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="740" y="480" font-size="9" fill="#10b981" font-weight="600">gRPC to UPF</text>

  <line x1="920" y1="460" x2="920" y2="495" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="860" y="480" font-size="9" fill="#e11d48" font-weight="600">Queue Billing</text>

  <!-- Sidecar box -->
  <rect x="585" y="500" width="170" height="50" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="670" y="518" font-size="10" font-weight="600" fill="#831843" text-anchor="middle">Sidecar: billing-flushd</text>
  <text x="670" y="533" font-size="9" fill="#334155" text-anchor="middle">Every 5s: buffer → S3</text>

  <!-- Arrow to Layer 3 -->
  <line x1="940" y1="540" x2="940" y2="590" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="960" y="570" font-size="10" fill="#10b981" text-anchor="start" font-weight="600">gRPC:</text>
  <text x="960" y="585" font-size="10" fill="#10b981" text-anchor="start">SetupBearer(...)</text>

  <!-- ========== LAYER 3: UPF ========== -->
  <rect x="560" y="590" width="760" height="280" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <circle cx="580" cy="610" r="16" fill="#047857"/>
  <text x="580" y="616" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="750" y="620" font-size="15" font-weight="700" fill="#065f46">LAYER 3: UPF</text>
  <text x="750" y="642" font-size="11" fill="#065f46">(User Plane Function — Data Forwarding)</text>

  <!-- UPF pod container -->
  <rect x="575" y="660" width="730" height="200" rx="6" fill="#fff" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="750" y="680" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">UPF Pod (5 replicas, HPA 3–100, CPU-heavy: 2000m)</text>

  <!-- Instruction from core-network -->
  <rect x="585" y="695" width="150" height="50" rx="4" fill="#dbeafe" stroke="#0284c7" stroke-width="1"/>
  <text x="660" y="713" font-size="9" font-weight="600" fill="#0c4a6e" text-anchor="middle">Receive Instruction</text>
  <text x="660" y="728" font-size="8" fill="#334155" text-anchor="middle">bearer_001, QoS: 50Mbps</text>

  <line x1="735" y1="720" x2="765" y2="720" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Setup bearer -->
  <rect x="765" y="695" width="130" height="50" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="830" y="713" font-size="9" font-weight="600" fill="#166534" text-anchor="middle">Setup Bearer</text>
  <text x="830" y="728" font-size="8" fill="#334155" text-anchor="middle">Rate limit, QoS shaper</text>

  <line x1="895" y1="720" x2="925" y2="720" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Forward packets -->
  <rect x="925" y="695" width="150" height="50" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="1000" y="713" font-size="9" font-weight="600" fill="#9a3412" text-anchor="middle">Forward Packets</text>
  <text x="1000" y="728" font-size="8" fill="#334155" text-anchor="middle">Apply QoS, rate limit</text>

  <!-- Packet processing details -->
  <rect x="585" y="755" width="700" height="85" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="595" y="775" font-size="9" fill="#065f46" font-weight="600">When packet arrives (1024 bytes):</text>
  <text x="595" y="795" font-size="8" fill="#334155">1. Extract device ID → Look up bearer_001</text>
  <text x="595" y="810" font-size="8" fill="#334155">2. Rate limit check: 50 Mbps available? YES → Forward</text>
  <text x="595" y="825" font-size="8" fill="#334155">3. Log event to billing buffer (async) → Sidecar flushes to S3</text>

  <!-- ========== OUTPUT ========== -->
  <!-- Arrow from UPF to NLB -->
  <line x1="940" y1="870" x2="940" y2="920" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- NLB -->
  <rect x="820" y="920" width="240" height="100" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="940" y="950" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Public NLB</text>
  <text x="940" y="970" font-size="10" fill="#065f46" text-anchor="middle">Load balancer for customer traffic</text>
  <text x="940" y="990" font-size="10" fill="#065f46" text-anchor="middle">Only public surface in hub</text>

  <!-- Arrow to IGW -->
  <line x1="940" y1="1020" x2="940" y2="1070" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- IGW -->
  <rect x="820" y="1070" width="240" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="940" y="1095" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">Internet Gateway</text>
  <text x="940" y="1115" font-size="10" fill="#1e40af" text-anchor="middle">Egress to internet</text>

  <!-- Arrow to customer -->
  <line x1="940" y1="1150" x2="940" y2="1200" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Customer -->
  <rect x="820" y="1200" width="240" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="940" y="1225" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">Customer</text>
  <text x="940" y="1245" font-size="10" fill="#1e40af" text-anchor="middle">Application / device</text>
  <text x="940" y="1265" font-size="10" fill="#1e40af" text-anchor="middle">Response received</text>

  <!-- ========== EXTERNAL SERVICES ========== -->

  <!-- ElastiCache (right side) -->
  <rect x="1400" y="300" width="240" height="150" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="1520" y="330" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">ElastiCache (Redis)</text>
  <text x="1520" y="355" font-size="10" fill="#78350f" text-anchor="middle">Multi-AZ cluster</text>
  <text x="1520" y="375" font-size="9" fill="#334155" text-anchor="middle">Session state:</text>
  <text x="1520" y="390" font-size="8" fill="#334155" text-anchor="middle">device:{status, qos,</text>
  <text x="1520" y="402" font-size="8" fill="#334155" text-anchor="middle">bearer, upf_target}</text>
  <text x="1520" y="420" font-size="9" fill="#334155" text-anchor="middle">TTL: 600 seconds</text>

  <!-- Arrow from Core-Network to Redis -->
  <line x1="1320" y1="390" x2="1400" y2="365" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1340" y="370" font-size="9" fill="#b45309" font-weight="600">Query</text>
  <text x="1340" y="385" font-size="9" fill="#b45309" font-weight="600">Update</text>

  <!-- S3 (right side) -->
  <rect x="1400" y="480" width="240" height="150" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="1520" y="510" font-size="12" font-weight="700" fill="#831843" text-anchor="middle">S3 Bucket</text>
  <text x="1520" y="535" font-size="10" fill="#831843" text-anchor="middle">(Billing Logs)</text>
  <text x="1520" y="555" font-size="9" fill="#334155" text-anchor="middle">CDR events:</text>
  <text x="1520" y="570" font-size="8" fill="#334155" text-anchor="middle">device, bytes, QoS,</text>
  <text x="1520" y="582" font-size="8" fill="#334155" text-anchor="middle">timestamp</text>
  <text x="1520" y="600" font-size="9" fill="#334155" text-anchor="middle">Flush: every 5 sec</text>

  <!-- Arrow from sidecar to S3 -->
  <line x1="755" y1="525" x2="1400" y2="530" stroke="#be185d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1070" y="515" font-size="9" fill="#be185d" font-weight="600">Billing flush</text>

  <!-- ========== LEGEND ========== -->
  <rect x="30" y="1380" width="1940" height="200" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>

  <text x="50" y="1410" font-size="13" font-weight="700" fill="#0f172a">Key Characteristics by Layer</text>

  <!-- Layer 1 -->
  <rect x="50" y="1430" width="600" height="135" rx="6" fill="#fff" stroke="#3730a3" stroke-width="1"/>
  <text x="350" y="1455" font-size="11" font-weight="700" fill="#312e81" text-anchor="middle">Layer 1: Data-Ingress</text>
  <text x="60" y="1480" font-size="9" fill="#334155">• Stateless parser (no Redis)</text>
  <text x="60" y="1497" font-size="9" fill="#334155">• Input: Raw protocol data</text>
  <text x="60" y="1514" font-size="9" fill="#334155">• Output: Normalized JSON to Kafka</text>
  <text x="60" y="1531" font-size="9" fill="#334155">• Scales: Parse throughput</text>
  <text x="60" y="1548" font-size="9" fill="#334155">• Pods: 3–100/AZ (HPA 5 initial)</text>

  <!-- Layer 2 -->
  <rect x="700" y="1430" width="600" height="135" rx="6" fill="#fff" stroke="#b45309" stroke-width="1"/>
  <text x="1000" y="1455" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">Layer 2: Core-Network</text>
  <text x="710" y="1480" font-size="9" fill="#334155">• Control plane (queries Redis)</text>
  <text x="710" y="1497" font-size="9" fill="#334155">• Input: Normalized JSON from Kafka</text>
  <text x="710" y="1514" font-size="9" fill="#334155">• Output: gRPC instructions to UPF</text>
  <text x="710" y="1531" font-size="9" fill="#334155">• Scales: Decision latency</text>
  <text x="710" y="1548" font-size="9" fill="#334155">• Pods: 3–100/AZ (HPA 5 initial)</text>

  <!-- Layer 3 -->
  <rect x="1350" y="1430" width="600" height="135" rx="6" fill="#fff" stroke="#047857" stroke-width="1"/>
  <text x="1650" y="1455" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Layer 3: UPF</text>
  <text x="1360" y="1480" font-size="9" fill="#334155">• Data plane (no Redis)</text>
  <text x="1360" y="1497" font-size="9" fill="#334155">• Input: Instructions + packets</text>
  <text x="1360" y="1514" font-size="9" fill="#334155">• Output: Forwarded packets (NLB)</text>
  <text x="1360" y="1531" font-size="9" fill="#334155">• Scales: Packet throughput (Gbps)</text>
  <text x="1360" y="1548" font-size="9" fill="#334155">• Pods: 3–100/AZ (HPA 5 initial)</text>
</svg>
